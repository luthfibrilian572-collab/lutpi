<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Hotspot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --red: #e53e3e; --red-dk: #c53030; --red-lt: #feb2b2;
            --bg: #0a0a0f; --surface: #111118; --border: rgba(255,255,255,0.07);
            --text: #f7fafc; --muted: #718096;
        }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }
        .panel-left {
            flex: 1;
            background: linear-gradient(160deg, #1a0505 0%, #0a0a0f 60%);
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 48px 56px; position: relative; overflow: hidden; min-height: 100vh;
        }
        .panel-left::before {
            content: ''; position: absolute; width: 400px; height: 400px;
            border-radius: 50%; background: radial-gradient(circle, rgba(229,62,62,0.18) 0%, transparent 70%);
            top: -80px; right: -80px; pointer-events: none;
        }
        .brand { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
        .brand-icon { width: 40px; height: 40px; background: var(--red); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
        .panel-left-body { position: relative; z-index: 1; }
        .panel-left-body h2 { font-size: 38px; font-weight: 800; line-height: 1.15; letter-spacing: -1px; margin-bottom: 18px; }
        .panel-left-body h2 span { color: var(--red); }
        .panel-left-body p { color: var(--muted); font-size: 15px; line-height: 1.7; max-width: 340px; }
        .panel-left-footer { color: #4a5568; font-size: 12px; position: relative; z-index: 1; }
        .panel-right {
            width: 480px; flex-shrink: 0; background: var(--surface);
            border-left: 1px solid var(--border); display: flex; flex-direction: column;
            justify-content: center; padding: 56px 48px; min-height: 100vh;
        }
        .form-header { margin-bottom: 36px; }
        .form-header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
        .form-header p { color: var(--muted); font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #a0aec0; letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 8px; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; opacity: 0.5; }
        .form-group input {
            width: 100%; padding: 13px 16px 13px 42px; background: rgba(255,255,255,0.04);
            border: 1px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--text); outline: none; font-family: inherit;
        }
        .form-group input:focus { border-color: var(--red); background: rgba(229,62,62,0.05); box-shadow: 0 0 0 3px rgba(229,62,62,0.12); }
        .btn-primary {
            width: 100%; padding: 14px; background: var(--red); color: #fff; border: none;
            border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
            margin-top: 4px; box-shadow: 0 4px 16px rgba(229,62,62,0.35); transition: background 0.2s;
        }
        .btn-primary:hover { background: var(--red-dk); }
        .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .divider span { font-size: 12px; color: #4a5568; }
        .footer-link { text-align: center; font-size: 13px; color: var(--muted); }
        .footer-link a { color: var(--red-lt); text-decoration: none; font-weight: 600; }
        .message { padding: 12px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-top: 16px; display: none; }
        .message.success { background: rgba(72,187,120,0.12); color: #68d391; border: 1px solid rgba(72,187,120,0.2); }
        .message.error { background: rgba(229,62,62,0.12); color: #fc8181; border: 1px solid rgba(229,62,62,0.2); }
        .message.info { background: rgba(66,153,225,0.12); color: #63b3ed; border: 1px solid rgba(66,153,225,0.2); }
        @media (max-width: 860px) {
            .panel-left { display: none; }
            .panel-right { width: 100%; padding: 40px 28px; }
        }
    </style>
</head>
<body>

    <div class="panel-left">
        <div class="brand">
            <div class="brand-icon">📶</div>
            <span class="brand-name">HotspotNet</span>
        </div>
        <div class="panel-left-body">
            <h2>Akses internet<br>lebih <span>mudah</span><br>dari sebelumnya.</h2>
            <p>Daftar sekali, nikmati koneksi WiFi gratis kapanpun kamu berada di jaringan kami.</p>
        </div>
        <div class="panel-left-footer">© 2026 HotspotNet. All rights reserved.</div>
    </div>

    <div class="panel-right">
        <div class="form-header">
            <h1>Selamat datang 👋</h1>
            <p>Masuk ke akun kamu untuk mulai browsing</p>
        </div>

        <!-- Form Asli MikroTik Hotspot -->
        <form id="loginForm" name="login" action="$(link-login-only)" method="post">
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">

            <div class="form-group">
                <label>Username</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" value="$(username)" required placeholder="Masukkan username">
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" required placeholder="Masukkan password">
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <span id="btnText">Masuk</span>
            </button>
        </form>

        <div class="message" id="message"></div>
        <div class="divider"><span>atau</span></div>
        <div class="footer-link">
            Belum punya akun? <a href="register.html">Daftar sekarang</a>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://lutpi-2.vercel.app';
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');

        let isVerified = false;

        form.addEventListener('submit', async (e) => {
            if (!isVerified) {
                e.preventDefault();
                const usernameVal = document.getElementById('username').value;
                const passwordVal = document.getElementById('password').value;

                submitBtn.disabled = true;
                btnText.textContent = 'Memeriksa Akun...';

                try {
                    const response = await fetch(`${BACKEND_URL}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: usernameVal, password: passwordVal })
                    });

                    const data = await response.json();

                    if (data.success) {
                        showMessage('Login disetujui! Menghubungkan ke internet...', 'success');
                        isVerified = true; 
                        
                        // Lanjutkan submit form asli ke MikroTik agar router mengizinkan akses internet
                        setTimeout(() => {
                            HTMLFormElement.prototype.submit.call(form);
                        }, 800);
                    } else {
                        showMessage(data.message, 'error');
                        submitBtn.disabled = false;
                        btnText.textContent = 'Masuk';
                    }
                } catch (error) {
                    // Fallback aman jika jaringan Vercel terhalang
                    isVerified = true;
                    HTMLFormElement.prototype.submit.call(form);
                }
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
