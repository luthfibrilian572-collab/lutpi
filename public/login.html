<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Hotspot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red:     #e53e3e;
            --red-dk:  #c53030;
            --red-lt:  #feb2b2;
            --bg:      #0a0a0f;
            --surface: #111118;
            --border:  rgba(255,255,255,0.07);
            --text:    #f7fafc;
            --muted:   #718096;
            --subtle:  #2d3748;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* ── LEFT PANEL ── */
        .panel-left {
            flex: 1;
            background: linear-gradient(160deg, #1a0505 0%, #0a0a0f 60%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px 56px;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
        }

        /* geometric accent */
        .panel-left::before {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(229,62,62,0.18) 0%, transparent 70%);
            top: -80px; right: -80px;
            pointer-events: none;
        }
        .panel-left::after {
            content: '';
            position: absolute;
            width: 260px; height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(229,62,62,0.1) 0%, transparent 70%);
            bottom: 60px; left: -60px;
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .brand-icon {
            width: 40px; height: 40px;
            background: var(--red);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .panel-left-body {
            position: relative;
            z-index: 1;
        }
        .panel-left-body h2 {
            font-size: 38px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 18px;
        }
        .panel-left-body h2 span {
            color: var(--red);
        }
        .panel-left-body p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            max-width: 340px;
        }

        .features {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 40px;
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .feature-dot {
            width: 8px; height: 8px;
            background: var(--red);
            border-radius: 50%;
            flex-shrink: 0;
        }
        .feature-item span {
            font-size: 13px;
            color: #a0aec0;
        }

        .panel-left-footer {
            color: #4a5568;
            font-size: 12px;
            position: relative;
            z-index: 1;
        }

        /* ── RIGHT PANEL ── */
        .panel-right {
            width: 480px;
            flex-shrink: 0;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 56px 48px;
            min-height: 100vh;
        }

        .form-header { margin-bottom: 36px; }
        .form-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .form-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #a0aec0;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            pointer-events: none;
            opacity: 0.5;
        }
        .form-group input {
            width: 100%;
            padding: 13px 16px 13px 42px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            font-family: inherit;
        }
        .form-group input::placeholder { color: #4a5568; }
        .form-group input:focus {
            border-color: var(--red);
            background: rgba(229,62,62,0.05);
            box-shadow: 0 0 0 3px rgba(229,62,62,0.12);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.1px;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(229,62,62,0.35);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--red-dk);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(229,62,62,0.45);
        }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider span {
            font-size: 12px;
            color: #4a5568;
        }

        .footer-link {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }
        .footer-link a {
            color: var(--red-lt);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-link a:hover { text-decoration: underline; }

        /* Message */
        .message {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 16px;
            display: none;
        }
        .message.success { background: rgba(72,187,120,0.12); color: #68d391; border: 1px solid rgba(72,187,120,0.2); }
        .message.error   { background: rgba(229,62,62,0.12);  color: #fc8181; border: 1px solid rgba(229,62,62,0.2); }
        .message.info    { background: rgba(66,153,225,0.12); color: #63b3ed; border: 1px solid rgba(66,153,225,0.2); }

        /* Status check */
        .status-panel {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: none;
        }
        .status-panel.show { display: block; }
        .status-panel-title {
            font-size: 11px;
            font-weight: 600;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .status-row { display: flex; gap: 8px; }
        .status-row input {
            flex: 1;
            padding: 10px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text);
            outline: none;
            font-family: inherit;
        }
        .status-row input:focus { border-color: var(--red); }
        .status-row button {
            padding: 10px 16px;
            background: rgba(229,62,62,0.15);
            border: 1px solid rgba(229,62,62,0.3);
            color: #fc8181;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .status-row button:hover { background: rgba(229,62,62,0.25); }

        .status-result {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }
        .status-result.approved  { background: rgba(72,187,120,0.12); color: #68d391; border: 1px solid rgba(72,187,120,0.2); }
        .status-result.pending   { background: rgba(246,173,85,0.12);  color: #f6ad55; border: 1px solid rgba(246,173,85,0.2); }
        .status-result.rejected  { background: rgba(229,62,62,0.12);   color: #fc8181; border: 1px solid rgba(229,62,62,0.2); }
