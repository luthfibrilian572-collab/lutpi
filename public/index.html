<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotspotNet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red:    #e53e3e;
            --red-dk: #c53030;
            --bg:     #0a0a0f;
            --border: rgba(255,255,255,0.07);
            --text:   #f7fafc;
            --muted:  #4a5568;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle grid lines background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        /* Red glow center */
        body::after {
            content: '';
            position: fixed;
            width: 600px; height: 300px;
            background: radial-gradient(ellipse, rgba(229,62,62,0.08) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .splash {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Animated logo */
        .logo-ring {
            position: relative;
            width: 88px; height: 88px;
            margin-bottom: 28px;
        }
        .logo-ring svg {
            position: absolute;
            inset: 0;
            animation: rotate 2.4s linear infinite;
        }
        @keyframes rotate { to { transform: rotate(360deg); } }

        .logo-inner {
            position: absolute;
            inset: 10px;
            background: var(--red);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 0 32px rgba(229,62,62,0.4);
        }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
        }
        .brand-name span { color: var(--red); }

        .tagline {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 40px;
            letter-spacing: 0.2px;
        }

        /* Progress bar */
        .progress-track {
            width: 160px;
            height: 2px;
            background: rgba(255,255,255,0.07);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .progress-fill {
            height: 100%;
            background: var(--red);
            border-radius: 99px;
            animation: load 1.6s ease-in-out forwards;
        }
        @keyframes load {
            0%   { width: 0%; }
            60%  { width: 75%; }
            100% { width: 100%; }
        }

        .status-text {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.3px;
        }

        /* Bottom nav hint */
        .bottom-links {
            position: fixed;
            bottom: 28px;
            display: flex;
            gap: 20px;
        }
        .bottom-links a {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .bottom-links a:hover { color: #fc8181; }
        .bottom-links span { color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="splash">
        <!-- Spinning ring logo -->
        <div class="logo-ring">
            <svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="44" cy="44" r="40" stroke="rgba(229,62,62,0.2)" stroke-width="1.5"/>
                <path d="M44 4 A40 40 0 0 1 84 44" stroke="#e53e3e" stroke-width="2" stroke-linecap="round"/>
                <circle cx="84" cy="44" r="3" fill="#e53e3e"/>
            </svg>
            <div class="logo-inner">📶</div>
        </div>

        <div class="brand-name">Hotspot<span>Net</span></div>
        <div class="tagline">Menghubungkan kamu ke internet</div>

        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
        <div class="status-text">Memuat halaman login…</div>
    </div>

    <div class="bottom-links">
        <a href="login.html">Login</a>
        <span>·</span>
        <a href="register.html">Daftar</a>
        <span>·</span>
        <a href="admin.html">Admin</a>
    </div>

    <script>
        window.location.href = "/login.html";
    </script>
</body>
</html>
